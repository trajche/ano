<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ano Settings</title>
<style>
  :root { color-scheme: light dark; --border: #d4d4d8; --muted: #71717a; --error: #dc2626; --ok: #16a34a; }
  @media (prefers-color-scheme: dark) { :root { --border: #3f3f46; --muted: #a1a1aa; --error: #f87171; --ok: #4ade80; } }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; max-width: 520px; margin: 32px auto; padding: 0 16px; }
  h1 { font-size: 20px; margin: 0 0 24px; }
  .field { margin-bottom: 24px; }
  label.toggle { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
  label.text { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=url] { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; font: inherit; }
  input[type=url]:invalid { border-color: var(--error); }
  .hint { color: var(--muted); font-size: 13px; margin: 6px 0 0; }
  code { font-size: 12px; }
  #status { min-height: 20px; font-size: 13px; color: var(--ok); }
  #status.error { color: var(--error); }
</style>
</head>
<body>
  <h1>Ano Settings</h1>

  <div class="field">
    <label class="toggle"><input type="checkbox" id="video"> Record video</label>
    <p class="hint">Opens a small recorder window when a session starts. Allow popups for the site if it's blocked.</p>
  </div>

  <div class="field">
    <label class="text" for="webhook">Webhook URL</label>
    <input type="url" id="webhook" placeholder="https://example.com/webhook" spellcheck="false">
    <p class="hint">Each recording is sent here when the session ends, as <code>multipart/form-data</code>: <code>video</code> (.webm file) and <code>report</code> (JSON). Leave empty to turn this off.</p>
  </div>

  <div id="status" role="status"></div>

  <script src="options.js"></script>
</body>
</html>
