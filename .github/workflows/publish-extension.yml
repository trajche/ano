name: Publish Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Get version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Build Chrome + Firefox packages
        run: npm ci && npm run build && node scripts/build-extension.mjs ${{ steps.version.outputs.version }}

      - name: Upload Firefox package
        uses: actions/upload-artifact@v4
        with:
          name: ano-firefox-${{ steps.version.outputs.version }}
          path: dist/extension/ano-firefox-${{ steps.version.outputs.version }}.zip

      - name: Upload & publish to Chrome Web Store
        run: npx chrome-webstore-upload-cli@3 upload --source dist/extension/ano-chrome-${{ steps.version.outputs.version }}.zip --extension-id ndncffnjpgdmpiaegjndohfdnfgfeimf --auto-publish
        env:
          CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
